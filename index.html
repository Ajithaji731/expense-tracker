<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0f19">
  <title>Expenses</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💸</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%236366f1%22/><text x=%2250%%22 y=%2255%%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-size=%2260%22>💸</text></svg>">
  <link rel="stylesheet" href="styles.css?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="app-container">
    
    <!-- Top Navigation Bar -->
    <header class="top-nav">
      <div class="nav-brand">
        <span class="brand-emoji">💸</span>
        <h2>Expenses</h2>
      </div>

      <!-- Month Switcher Pill -->
      <div class="month-pill">
        <button id="prevMonthBtn" class="pill-arrow" aria-label="Previous Month">
          <i data-lucide="chevron-left"></i>
        </button>
        <select id="monthSelect" class="pill-select" aria-label="Select Month">
          <!-- Dynamically populated -->
        </select>
        <button id="nextMonthBtn" class="pill-arrow" aria-label="Next Month">
          <i data-lucide="chevron-right"></i>
        </button>
      </div>

      <!-- Nav Actions -->
      <div class="nav-actions">
        <!-- Live Cloud Sync Button -->
        <button id="syncNowBtn" class="action-pill-btn" title="Google Sheet Synced. Click to refresh">
          <span class="status-dot"></span>
          <span id="syncStatusText" class="sync-text">Synced</span>
          <i data-lucide="refresh-cw" class="sync-icon"></i>
        </button>

        <!-- Theme Toggle -->
        <button id="themeToggleBtn" class="icon-circle-btn" title="Toggle Theme">
          <i data-lucide="moon" id="themeIcon"></i>
        </button>
        <!-- Hidden select for JS compatibility -->
        <select id="themeSelect" style="display: none;">
          <option value="default">Dark</option>
          <option value="alt-dark">OLED</option>
          <option value="light">Light</option>
        </select>

        <button id="exportDataBtn" class="icon-circle-btn" title="Export Backup JSON">
          <i data-lucide="download"></i>
        </button>
      </div>
    </header>

    <!-- Tab Segmented Switcher -->
    <div class="segmented-control">
      <button class="segment-btn active" data-tab="dailyView">
        <i data-lucide="calendar"></i>
        <span>Daily Spending</span>
      </button>
      <button class="segment-btn" data-tab="compareView">
        <i data-lucide="layers"></i>
        <span>Monthly Expenses</span>
      </button>
    </div>

    <!-- VIEW 1: Daily View -->
    <div id="dailyView" class="view-content active">
      
      <!-- Sleek Hero Summary Banner -->
      <section class="hero-summary-card">
        <div class="hero-main">
          <span class="hero-month-tag" id="kpiMonthLabel">November 2026</span>
          <div class="hero-amount-row">
            <h1 class="hero-total" id="kpiTotalSpent">₹0</h1>
            <span class="hero-total-label">Spent This Month</span>
          </div>
        </div>
        
        <div class="hero-metrics-pill">
          <div class="metric-item">
            <span class="m-label">Today</span>
            <span class="m-val" id="heroTodayTotal">₹0</span>
          </div>
          <div class="metric-divider"></div>
          <div class="metric-item">
            <span class="m-label">Daily Avg</span>
            <span class="m-val" id="kpiDailyAvg">₹0</span>
          </div>
          <div class="metric-divider"></div>
          <div class="metric-item">
            <span class="m-label">Entries</span>
            <span class="m-val" id="kpiTxnCount">0</span>
          </div>
        </div>

        <!-- Hidden elements for script calculation safety -->
        <span id="kpiPeakDay" style="display: none;"></span>
        <span id="kpiPeakAmount" style="display: none;"></span>
        <span id="kpiTopCategory" style="display: none;"></span>
      </section>

      <!-- Instant Prompt Input Bar -->
      <section class="prompt-section">
        <form id="aiPromptForm" class="unified-input-box">
          <i data-lucide="zap" class="input-zap-icon"></i>
          <input 
            type="text" 
            id="aiPromptInput" 
            placeholder='Type: "spent 200 today", "nov 1 : 250 spent", "10 now"...' 
            autocomplete="off"
          >
          <button type="submit" class="log-submit-btn">
            <span>Log</span>
            <i data-lucide="arrow-right"></i>
          </button>
        </form>

        <!-- Fast Tap Amount Chips -->
        <div class="fast-chips-scroller">
          <button type="button" class="quick-chip" data-prompt="spend 10 now">+10</button>
          <button type="button" class="quick-chip" data-prompt="spent 20">+20</button>
          <button type="button" class="quick-chip" data-prompt="spent 50">+50</button>
          <button type="button" class="quick-chip" data-prompt="spent 100">+100</button>
          <button type="button" class="quick-chip" data-prompt="spent 200 for today">+200</button>
          <button type="button" class="quick-chip" data-prompt="spent 500 today">+500</button>
          <button type="button" class="quick-chip" data-prompt="spent 1000">+1000</button>
        </div>
      </section>

      <!-- Compact Daily Spending Side-Trend Chart -->
      <div class="daily-chart-card glass-panel" id="dailyChartSection">
        <div class="chart-title-row">
          <div class="d-chart-title">
            <i data-lucide="bar-chart-2"></i>
            <span id="dailyChartMonthLabel">November Daily Trend</span>
          </div>
          <span class="d-chart-peak" id="dailyChartPeakTag">Daily Spend</span>
        </div>
        <div class="daily-chart-box">
          <canvas id="dailyTrendChart"></canvas>
        </div>
      </div>

      <!-- Search & Date Filter Bar (Compact) -->
      <div class="sub-controls-bar">
        <div class="search-field">
          <i data-lucide="search"></i>
          <input type="text" id="searchInput" placeholder="Filter expenses...">
        </div>
        <select id="sortFilter" class="mini-select">
          <option value="date-desc">Newest first</option>
          <option value="date-asc">Oldest first</option>
          <option value="amount-desc">Highest ₹</option>
          <option value="amount-asc">Lowest ₹</option>
        </select>
        <!-- Hidden category filter for compatibility -->
        <select id="categoryFilter" style="display: none;">
          <option value="all">All</option>
        </select>
        <button id="openAddModalBtn" class="manual-add-btn" title="Manual Add">
          <i data-lucide="plus"></i>
        </button>
      </div>

      <!-- Day by Day List (with side graph: Nov 1 : 250 spent) -->
      <div id="dailyContainer" class="daily-stream">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- VIEW 2: Monthly Expenses (Replaced Comparison) -->
    <section id="compareView" class="view-content" style="display: none;">
      
      <!-- All-Time Tracked Overview -->
      <div class="monthly-overview-card glass-panel">
        <div class="m-hero-left">
          <span class="m-hero-sub">All-Time Spend</span>
          <h2 id="cmpOverallTotal" class="m-hero-val">₹0</h2>
        </div>
        <div class="m-hero-stats">
          <div class="m-stat">
            <span class="m-stat-label">Months</span>
            <span id="cmpMonthsCount" class="m-stat-val">1</span>
          </div>
          <div class="m-stat-divider"></div>
          <div class="m-stat">
            <span class="m-stat-label">Monthly Avg</span>
            <span id="cmpOverallAvg" class="m-stat-val">₹0</span>
          </div>
        </div>
      </div>

      <!-- Monthly Trend Bar Chart -->
      <div class="chart-container-card glass-panel">
        <div class="chart-title-row">
          <div class="d-chart-title">
            <i data-lucide="trending-up"></i>
            <span>Month-by-Month Expenses</span>
          </div>
        </div>
        <div class="chart-box">
          <canvas id="monthlyCompareChart"></canvas>
        </div>
      </div>

      <!-- Monthly Expenses List (Nov 2026 - 4000, Dec 2026 - 2300* ongoing month) -->
      <div class="monthly-list-section">
        <div class="section-title-row">
          <h3>Monthly Expenses</h3>
          <span class="ongoing-legend">* ongoing month</span>
        </div>
        <div id="monthlyExpensesList" class="monthly-cards-stream">
          <!-- Dynamically populated -->
        </div>
      </div>

      <!-- Hidden elements for chart/script safety -->
      <div style="display: none;">
        <span id="cmpHighestMonth"></span>
        <span id="cmpHighestAmount"></span>
        <table class="comparison-table"><tbody id="comparisonTableBody"></tbody></table>
        <canvas id="categoryCompareChart"></canvas>
        <canvas id="categoryDonutChart"></canvas>
      </div>
    </section>

  </div>

  <!-- MODAL: Add / Edit Expense Manual -->
  <div id="expenseModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">Log Expense</h3>
        <button id="closeExpenseModal" class="btn-close">
          <i data-lucide="x"></i>
        </button>
      </div>

      <form id="expenseForm">
        <input type="hidden" id="editExpenseId">

        <div class="form-group">
          <label for="formAmount">Amount (₹) *</label>
          <input type="number" id="formAmount" class="form-control" placeholder="E.g. 50, 200, 500" required min="1" step="any">
        </div>

        <div class="form-group">
          <label for="formDescription">Description (Optional)</label>
          <input type="text" id="formDescription" class="form-control" placeholder="Expense">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="formDate">Date</label>
            <input type="date" id="formDate" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="formTime">Time</label>
            <input type="text" id="formTime" class="form-control" placeholder="10:30 AM">
          </div>
        </div>

        <!-- Hidden fields for compatibility -->
        <select id="formCategory" style="display: none;"></select>
        <select id="formPaymentMode" style="display: none;">
          <option value="UPI">UPI</option>
        </select>

        <div class="modal-footer">
          <button type="button" id="cancelExpenseBtn" class="btn-cancel">Cancel</button>
          <button type="submit" class="btn-save">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="app.js?v=3"></script>
</body>
</html>
